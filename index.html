<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot Alive — Legal</title>
<style>
  :root { --bg:#fff6ec; --panel:#fff; --text:#3a2e27; --dim:#8a7a6c; --accent:#ff7a4d; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1b1713; --panel:#241e18; --text:#f3eadf; --dim:#a79585; }
  }
  :root[data-theme="dark"] { --bg:#1b1713; --panel:#241e18; --text:#f3eadf; --dim:#a79585; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 56px 16px 72px; }
  header { display:flex; align-items:center; gap:14px; margin-bottom: 10px; }
  .logo { width:46px; height:46px; border-radius:12px; background:var(--accent);
          display:grid; place-items:center; color:#fff; font-weight:800; font-size:20px; }
  h1 { font-size: 27px; margin: 0; letter-spacing:-0.4px; }
  p.sub { color:var(--dim); margin:0 0 28px; }
  a.card { display:block; background:var(--panel); border-radius:14px; padding:18px 20px;
           margin-bottom:12px; text-decoration:none; color:var(--text);
           box-shadow: 0 1px 3px rgba(0,0,0,.07); }
  a.card b { display:block; font-size:17px; }
  a.card span { color:var(--dim); font-size:14px; }
  footer { color:var(--dim); font-size:14px; margin-top:32px; }
</style>
</head>
<body>
<div class="wrap">
  <header><div class="logo">S</div><h1>Spot Alive</h1></header>
  <p class="sub">Merivo Ltd</p>
  <a class="card" href="privacy-policy.html"><b>Privacy Policy</b><span>English</span></a>
  <a class="card" href="gizlilik-politikasi.html"><b>Gizlilik Politikası</b><span>Türkçe</span></a>
  <footer>Contact: <a href="mailto:merivoltd@gmail.com">merivoltd@gmail.com</a></footer>
</div>
</body>
</html>
